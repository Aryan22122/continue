name: Auto-Continue Claude Task

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual testing

jobs:
  continue-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit CHECKPOINT.md back to your repo
    timeout-minutes: 360 # 6-hour hard limit for the job (safety net)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Task with Retry Watchdog
        run: |
          claude -p "Read CHECKPOINT.md. Do only the 'Next step'. After every small step, update CHECKPOINT.md, commit, and push." \
            --allowedTools "Read,Write,Edit,Bash(git *)"
        env:
          # --- THIS IS THE MAGIC THAT PRESSES CONTINUE AUTOMATICALLY ---
          CLAUDE_CODE_RETRY_WATCHDOG: "1"
          # Optional: Prevent waiting forever if the reset is days away
          # CLAUDE_CODE_RETRY_WATCHDOG_MAX_USAGE_LIMIT_WAIT_MS: "21600000" # 6 hours max wait
          
          # --- YOUR API KEY (Required for Free Plan) ---
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # If you are using the free NVIDIA proxy, set the base URL instead:
          # ANTHROPIC_BASE_URL: "http://localhost:8082"

      - name: Commit and Push Progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: auto-resume checkpoint update [skip ci]"
          git push
